<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>로딩 화면</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="background-a" class="background visible"></div>
    <div id="background-b" class="background"></div>

    <script>
        const backgrounds = [
            "background.jpg",
            "background2.jpg"
        ];

        let currentIndex = 0;
        let firstBackgroundIsVisible = true;

        const backgroundA = document.getElementById("background-a");
        const backgroundB = document.getElementById("background-b");

        backgroundA.style.backgroundImage =
            'url("' + backgrounds[0] + '")';

        backgrounds.forEach(function (fileName) {
            const image = new Image();
            image.src = fileName;
        });

        setInterval(function () {
            currentIndex++;

            if (currentIndex >= backgrounds.length) {
                currentIndex = 0;
            }

            const incomingBackground =
                firstBackgroundIsVisible ? backgroundB : backgroundA;

            const outgoingBackground =
                firstBackgroundIsVisible ? backgroundA : backgroundB;

            incomingBackground.style.backgroundImage =
                'url("' + backgrounds[currentIndex] + '")';

            incomingBackground.classList.add("visible");
            outgoingBackground.classList.remove("visible");

            firstBackgroundIsVisible = !firstBackgroundIsVisible;
        }, 3000);
    </script>
</body>
</html>
